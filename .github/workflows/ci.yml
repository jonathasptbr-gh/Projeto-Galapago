name: CI

# Dois tipos de entrega (docs/BUILD.md):
#   commit comum  → só `testes` (testes + quadros + comparação com a última
#                   publicação, como AVISO no resumo do run)
#   publicação    → push em main de commit `vX.Y.Z: …` (ou dispatch com
#                   publicar=true, ou tag v*) → também `preview` (Pages) e
#                   `apk` (Release `dev` + versao.json; tag → Release da tag)
# PR: só `testes`. Ver docs/GODOT.md ("Exportar para Android").
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar (APK + Release dev + preview)'
        required: false
        default: false
        type: boolean

env:
  GODOT_VERSION: "4.7.2"

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # baixar o artefato `quadros` da última publicação
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
    steps:
      # Publica só: push em main com commit `vX.Y.Z: …`, tag v*, ou dispatch
      # com publicar=true. A mensagem vai por env (nunca interpolada no shell).
      - name: Decidir publicação
        id: decidir
        env:
          EVENTO: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          PEDIDO: ${{ inputs.publicar }}
        run: |
          publicar=false
          primeira="${MSG%%$'\n'*}"
          versao='^v[0-9]+\.[0-9]+\.[0-9]+:'
          if [ "$EVENTO" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then publicar=true
          elif [ "$EVENTO" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [[ "$primeira" =~ $versao ]]; then publicar=true
          elif [ "$EVENTO" = workflow_dispatch ] && [ "$PEDIDO" = true ]; then publicar=true
          fi
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "Publicação: **$publicar** ($EVENTO, $GITHUB_REF)" >> "$GITHUB_STEP_SUMMARY"
          echo "publicar=$publicar"

      - uses: actions/checkout@v7

      - name: Segredos (o repositório é público)
        run: |
          if grep -rInE 'pixl_[0-9a-f]{8}|ghp_[A-Za-z0-9]{8}|github_pat_[A-Za-z0-9]{8}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            --exclude-dir=.git --exclude-dir=.godot --exclude-dir=node_modules . ; then
            echo "REPROVADO: padrão de segredo no repositório (ver docs/BUILD.md)." >&2
            exit 1
          fi
          echo "nenhum padrão de segredo"

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o g.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip -d "$HOME/godot" && rm g.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Testes (headless)
        run: tools/testes.sh

      # Verdade do oráculo: Mobile/Vulkan por software (lavapipe), o renderizador
      # do APK. A prévia local é Compatibility/OpenGL (docs/ORACULO.md).
      - name: Quadros (oráculo visual)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers
          # 90 quadros (3 s a 30 fps): a demo gira a câmera em t≈2 s
          QUADROS_RENDER=vulkan GALLIUM_DRIVER=llvmpipe tools/quadros.sh 90 quadros
          grep -m1 -E '^(Vulkan|OpenGL) ' quadros/log.txt >> "$GITHUB_STEP_SUMMARY" || true

      # Referência = artefato `quadros` da última publicação verde em main.
      # Diferença visual é AVISO no resumo; reprova só quadro faltando.
      - name: Quadros × última publicação
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/quadros-referencia.mjs quadros --dest "$RUNNER_TEMP/referencia"

      - name: Publicar quadros
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quadros
          path: quadros/
          retention-days: ${{ steps.decidir.outputs.publicar == 'true' && 90 || 7 }}

      # P24: a vitrine 3D (jogo/mundo3d/) em Vulkan, com e sem Pixel Pass —
      # prova dos shaders no renderizador do APK. Padrão = 3D liso; o Pixel
      # Pass pede `--pixel` (S5a). `--sob-arvore` (S6): o contorno de tela pela
      # profundidade na base do tronco/ator, na quina e na copa sobre o ator.
      - name: Quadros da vitrine 3D
        run: |
          export QUADROS_RENDER=vulkan GALLIUM_DRIVER=llvmpipe QUADROS_FPS=10
          export QUADROS_CENA=res://jogo/mundo3d/vitrine.tscn
          DEMO_ARGS="--pixel" tools/quadros.sh 30 vitrine3d/pixel
          tools/quadros.sh 30 vitrine3d/liso
          DEMO_ARGS="--vista-intima" tools/quadros.sh 30 vitrine3d/intima
          DEMO_ARGS="--sob-arvore" tools/quadros.sh 20 vitrine3d/sob-arvore

      - name: Publicar vitrine 3D
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitrine3d
          path: vitrine3d/
          retention-days: 7

  # Preview da publicação: `_site/` vai para o GitHub Pages. NÃO comenta
  # no commit/PR — o comentário automático gerava e-mail a cada push; a
  # aprovação é no chat do DSH. `continue-on-error`: um problema de Pages não
  # pode segurar o APK.
  preview:
    needs: testes
    if: always() && needs.testes.result != 'cancelled' && needs.testes.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Quadros do run
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: quadros
          path: quadros

      - name: Pillow (GIF)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Montar o site do lote
        continue-on-error: true
        run: node tools/preview.mjs --site

      - name: Enviar ao Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # O Pages precisa indexar o artefato recém-enviado: deployar no mesmo
      # segundo falha com "Fetching artifact metadata failed" (visto no #64).
      - name: Pausa (índice do artefato)
        run: sleep 8

      - name: Publicar o Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Publicar o Pages (2ª tentativa)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Resumo do preview (sem comentário)
        if: always()
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
        run: |
          if [ -n "$PREVIEW_URL" ]; then
            echo "Preview do lote: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Preview indisponível neste run (Pages falhou)." >> "$GITHUB_STEP_SUMMARY"
          fi

  apk:
    needs: testes
    if: needs.testes.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o g.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip -d "$HOME/godot" && rm g.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # O .tpz tem 1,2 GB; só os dois templates Android ficam em cache.
      - name: Templates Android (cache)
        id: tpl
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-android-${{ env.GODOT_VERSION }}

      - name: Templates Android (download)
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          d="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$d"
          curl -fsSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -l t.tpz | grep -E 'android|version.txt' || true
          unzip -j -o t.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$d" || [ $? -eq 11 ]
          rm t.tpz
          ls -la "$d"
          test -s "$d/android_release.apk" && test -s "$d/android_debug.apk"

      # O keystore vem SÓ dos secrets (o repositório é público): é ele que faz
      # o Android aceitar a atualização por cima — e recusar qualquer outra.
      - name: Exportar APK
        id: exp
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          echo "SDK: ${ANDROID_HOME:-?} · build-tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/galapago.keystore"
          printf '%s' "$KS_B64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          tools/android/exportar.sh "${{ github.run_number }}"
          rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"

      - name: APK como artefato
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: exportar/projeto-galapago.apk
          retention-days: 14

      # A Release leva o APK e o MANIFESTO versao.json (o mesmo método do Áudio
      # Visual IASD): o app lê releases/download/dev/versao.json — sem API, sem
      # limite, sem login —, baixa o APK que ele aponta e abre o instalador.
      - name: Publicar Release (APK + versao.json)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.exp.outputs.versao }}
          BUILD: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; NOME="projeto-galapago-${GITHUB_REF_NAME}.apk"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then TAG=dev; NOME="projeto-galapago-dev.apk"
          else exit 0; fi
          cp exportar/projeto-galapago.apk "$NOME"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NOME}"
          printf '{\n "versao_codigo": %s,\n "versao_nome": "%s",\n "apk": "%s",\n "bytes": %s,\n "sha256": "%s",\n "commit": "%s",\n "publicado_em": "%s"\n}\n' \
            "$BUILD" "$VERSAO" "$URL" "$(stat -c %s "$NOME")" "$(sha256sum "$NOME" | cut -d' ' -f1)" \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > versao.json
          cat versao.json
          if [[ "$TAG" == dev ]]; then
            gh release delete dev --yes --cleanup-tag || true
            gh release create dev "$NOME" versao.json --prerelease --target "$GITHUB_SHA" \
              --title "Dev — ${VERSAO}" --notes "Build automático de main (${GITHUB_SHA}). O app se atualiza sozinho a partir desta Release."
          else
            gh release create "$TAG" "$NOME" versao.json --title "Projeto Galápago ${TAG}" --notes "APK ${VERSAO}, commit ${GITHUB_SHA}."
          fi
