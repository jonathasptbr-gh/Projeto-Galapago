name: CI

# testes  → testes headless + oráculo de quadros (artefato `quadros`)
# apk     → exporta o APK Android (P2) e publica:
#           push em main  → Release `dev` (pré-release, refeita a cada push)
#           tag v*        → Release da tag
# Ver docs/GODOT.md ("Exportar para Android") e docs/BUILD.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o g.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip -d "$HOME/godot" && rm g.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Testes (headless)
        run: tools/testes.sh

      - name: Quadros (oráculo visual)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          GALLIUM_DRIVER=llvmpipe tools/quadros.sh 60 quadros

      - name: Publicar quadros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadros
          path: quadros/
          retention-days: 7

  apk:
    needs: testes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o g.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip -d "$HOME/godot" && rm g.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # O .tpz tem 1,2 GB; só os dois templates Android ficam em cache.
      - name: Templates Android (cache)
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-android-${{ env.GODOT_VERSION }}

      - name: Templates Android (download)
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          d="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$d"
          curl -fsSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -l t.tpz | grep -E 'android|version.txt' || true
          unzip -j -o t.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$d" || [ $? -eq 11 ]
          rm t.tpz
          ls -la "$d"
          test -s "$d/android_release.apk" && test -s "$d/android_debug.apk"

      # O keystore vem SÓ dos secrets (o repositório é público): é ele que faz
      # o Android aceitar a atualização por cima — e recusar qualquer outra.
      - name: Exportar APK
        id: exp
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          echo "SDK: ${ANDROID_HOME:-?} · build-tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/galapago.keystore"
          printf '%s' "$KS_B64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          tools/android/exportar.sh "${{ github.run_number }}"
          rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"

      - name: APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: exportar/projeto-galapago.apk
          retention-days: 14

      # A Release leva o APK e o MANIFESTO versao.json (o mesmo método do Áudio
      # Visual IASD): o app lê releases/download/dev/versao.json — sem API, sem
      # limite, sem login —, baixa o APK que ele aponta e abre o instalador.
      - name: Publicar Release (APK + versao.json)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.exp.outputs.versao }}
          BUILD: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; NOME="projeto-galapago-${GITHUB_REF_NAME}.apk"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then TAG=dev; NOME="projeto-galapago-dev.apk"
          else exit 0; fi
          cp exportar/projeto-galapago.apk "$NOME"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NOME}"
          printf '{\n "versao_codigo": %s,\n "versao_nome": "%s",\n "apk": "%s",\n "bytes": %s,\n "sha256": "%s",\n "commit": "%s",\n "publicado_em": "%s"\n}\n' \
            "$BUILD" "$VERSAO" "$URL" "$(stat -c %s "$NOME")" "$(sha256sum "$NOME" | cut -d' ' -f1)" \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > versao.json
          cat versao.json
          if [[ "$TAG" == dev ]]; then
            gh release delete dev --yes --cleanup-tag || true
            gh release create dev "$NOME" versao.json --prerelease --target "$GITHUB_SHA" \
              --title "Dev — ${VERSAO}" --notes "Build automático de main (${GITHUB_SHA}). O app se atualiza sozinho a partir desta Release."
          else
            gh release create "$TAG" "$NOME" versao.json --title "Projeto Galápago ${TAG}" --notes "APK ${VERSAO}, commit ${GITHUB_SHA}."
          fi
